services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketplace-api:hw-11
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_URL: postgresql://app_user@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      pgbouncer:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - '6432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U app_user -d marketplace']
      interval: 2s
      timeout: 2s
      retries: 15

  db:
    image: postgres:17-alpine
    ports:
      - '21432:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-local-only
      POSTGRES_DB: marketplace
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d marketplace']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres_data:
